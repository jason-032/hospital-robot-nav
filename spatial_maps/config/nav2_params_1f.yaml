# Floor 1F overlay, loaded after nav2_params.yaml by spatial_maps_1f.launch.py.
# Other floors are unchanged until this configuration is validated on 1F.
#
# Why (15 September 2026, see CLAUDE.md open problem 2):
#   - The robot is 0.61 x 0.50 m with base_footprint on the wheel axle, so the body
#     reaches 0.50 m ahead of it. robot_radius 0.27 let it clip wall corners.
#   - NavFn treats the robot as a circle. With an honest radius and 0.05 m padding
#     it reaches 63 of 74 sweep goals offline; a footprint-aware lattice planner
#     reaches 74 (tools/sim_checks/footprint_reachability.py).
#   - Smooth inflation keeps paths centred; doorways are slowed by a speed mask.

amcl:
  ros__parameters:
    # The aligned wall mesh puts 99% of LiDAR returns within 0.06 m of occupied
    # cells, and odometry now tracks ground truth to 0.1%, so AMCL corrects the
    # residual drift instead of the static map->odom transform (removed from the
    # 1F launch). A 1 degree heading error in the first turn drifted the robot
    # 0.6 m sideways over 35 m in nav_smoke_2.
    tf_broadcast: true
    # Odometry now tracks ground truth to 0.1%, while 77% of mapped obstacle cells
    # in the eastern hall have no physical geometry (the mesh is walls and columns
    # only), so scan matching there is fed obstacles the LiDAR cannot see. Trust
    # odometry, use more beams and particles, and the real 12 m LiDAR range.
    # With the defaults AMCL diverged 13 m in 25 s and the robot drove off the map.
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    max_beams: 180
    laser_max_range: 12.0
    laser_min_range: 0.2
    min_particles: 1000
    max_particles: 5000
    update_min_d: 0.1
    update_min_a: 0.1
    set_initial_pose: true
    initial_pose:
      x: 21.0
      y: 38.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: "/home/jason/ros2_ws/install/spatial_maps/share/spatial_maps/config/navigate_to_pose_bt_1f.xml"

planner_server:
  ros__parameters:
    planner_plugins:
      - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerLattice
      # Differential-drive primitives: 16 headings, 0.5 m turning radius, in-place
      # rotations, 5 cm grid. The global costmap must use the same resolution.
      lattice_filepath: /opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json
      allow_unknown: false
      tolerance: 0.5
      # A 35 m plan over the 0.05 m costmap with 16 headings needs far more than
      # the 1e6 default, which aborted every goal in the first smoke test.
      max_iterations: 20000000
      max_on_approach_iterations: 1000
      max_planning_time: 30.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      allow_reverse_expansion: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

controller_server:
  ros__parameters:
    speed_limit_topic: /speed_limit
    stopped_goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      trans_stopped_velocity: 0.25
      rot_stopped_velocity: 0.25
      # 0.5 m let the robot stop half a metre off the goal, often against a wall,
      # where its own footprint counted as occupied and the planner then refused
      # every later goal ("Start occupied", 93 of 94 in p5_lattice_amcl_sweep_1).
      # Goals are projected to 0.65 m clearance, so 0.25 m keeps 0.40 m, above the
      # 0.30 m the padded footprint needs.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.785

# Convex hull of body (x -0.15..0.45, y +-0.20), wheels (x +-0.10, y +-0.25) and
# camera (x 0.46), in base_footprint (wheel axle) coordinates.
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.46, 0.20], [0.10, 0.25], [-0.10, 0.25], [-0.15, 0.20], [-0.15, -0.20], [-0.10, -0.25], [0.10, -0.25], [0.46, -0.20]]"
      footprint_padding: 0.05
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.5
        inflation_radius: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      resolution: 0.05
      footprint: "[[0.46, 0.20], [0.10, 0.25], [-0.10, 0.25], [-0.15, 0.20], [-0.15, -0.20], [-0.10, -0.25], [0.10, -0.25], [0.46, -0.20]]"
      footprint_padding: 0.05
      filters:
        - speed_filter
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        enabled: true
        map_topic: /map_global         # maps/1F_05.pgm, conservative 0.05 m resample of 1F.pgm
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.5
        inflation_radius: 1.0
      speed_filter:
        plugin: nav2_costmap_2d::SpeedFilter
        enabled: true
        filter_info_topic: /speed_costmap_filter_info
        speed_limit_topic: /speed_limit

# Speed mask (maps/1F_speed_mask.pgm): 1 m discs around the 76 BIM door nodes at
# about 50% of maximum speed. speed_limit % = 100 - mask value.
speed_filter_mask_server:
  ros__parameters:
    frame_id: map
    topic_name: /speed_filter_mask
    yaml_filename: ""                  # set at launch

speed_costmap_filter_info_server:
  ros__parameters:
    type: 1
    filter_info_topic: /speed_costmap_filter_info
    mask_topic: /speed_filter_mask
    base: 100.0
    multiplier: -1.0
